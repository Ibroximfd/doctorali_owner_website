<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Mobil — Doctor Ali Nazorat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#050d09}
@keyframes reveal{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes orb{0%{border-radius:48% 52% 60% 40%/50% 45% 55% 50%;transform:rotate(0)}50%{border-radius:58% 42% 45% 55%/45% 58% 42% 55%}100%{border-radius:48% 52% 60% 40%/50% 45% 55% 50%;transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@keyframes slide{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; font-family: Manrope, system-ui, sans-serif; color: #e8f1ec; background: radial-gradient(400px 300px at 80% 0%, rgba(63,214,154,.14), transparent 60%), #050d09; overflow: hidden; display: flex; flex-direction: column">
  <div style="flex: 1; overflow: hidden; padding: 54px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 13px; color: #9db3a7">Seshanba, 28-oktyabr</span>
      <span style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(140deg, #e8c26a, #9b7424); color: #04110b; display: grid; place-items: center; font-size: 12px; font-weight: 700">AA</span>
    </div>
    <h1 style="margin: 14px 0 0; font-family: Fraunces, serif; font-weight: 400; font-size: 31px; line-height: 1.12; letter-spacing: -.01em; animation: reveal .8s both">Bugun <span style="color: #8af0c2">312 mln</span> tushum. <span style="color: #ff8a6a">3 ta</span> ish sizni kutyapti.</h1>

    <div style="margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
        <div style="padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid rgba(180,230,200,.09); animation: reveal .7s {{k.delay}} both">
          <div style="font-size: 12px; color: #9db3a7">{{k.label}}</div>
          <div style="margin-top: 4px; font: 600 22px 'JetBrains Mono', monospace">{{k.value}}</div>
          <div style="font-size: 11px; color: {{k.color}}">{{k.delta}}</div>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: {{a.bg}}; border: 1px solid {{a.border}}; animation: reveal .7s {{a.delay}} both">
          <span style="position: relative; flex: none; width: 10px; height: 10px"><span style="position: absolute; inset: 0; border-radius: 50%; background: {{a.color}}"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: {{a.color}}; animation: ping 2s infinite"></span></span>
          <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 700">{{a.title}}</span><span style="display: block; font-size: 12px; color: #9db3a7">{{a.sub}}</span></span>
          <span style="font: 600 13px 'JetBrains Mono', monospace; color: {{a.color}}">{{a.amount}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 16px; padding: 14px; border-radius: 20px; background: rgba(255,255,255,.03); border: 1px solid rgba(180,230,200,.09)">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 700">Filiallar</span><span style="color: #6f877b">bugun</span></div>
      <sc-for list="{{filials}}" as="f" hint-placeholder-count="4">
        <div style="margin-top: 10px; display: grid; grid-template-columns: 84px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13px">
          <span style="color: #c8d6cf">{{f.name}}</span>
          <span style="height: 8px; border-radius: 4px; background: rgba(255,255,255,.05); overflow: hidden"><span style="display: block; height: 100%; width: {{f.pct}}%; border-radius: 4px; background: linear-gradient(90deg, #17664a, #3fd69a); transform-origin: left; animation: slide 1s {{f.delay}} cubic-bezier(.16,1,.3,1) both"></span></span>
          <span style="text-align: right; font: 600 12px 'JetBrains Mono', monospace">{{f.value}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; right: 16px; bottom: 104px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 999px; background: rgba(10,24,18,.92); border: 1px solid rgba(63,214,154,.3); box-shadow: 0 16px 40px -12px rgba(63,214,154,.4)">
    <span style="font-size: 13px; font-weight: 600; color: #8af0c2">AI'dan so'rang</span>
    <span style="width: 40px; height: 40px; background: conic-gradient(from 0deg, #3fd69a, #6fb3ff, #e8c26a, #3fd69a); animation: orb 8s linear infinite"></span>
  </div>

  <nav aria-label="Asosiy" style="flex: none; display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 8px 28px; background: rgba(5,13,9,.95); border-top: 1px solid rgba(180,230,200,.08)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: {{t.weight}}; color: {{t.color}}">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (label, href, icon, on) => ({ label, href, icon, color: on ? '#8af0c2' : '#6f877b', weight: on ? 700 : 500 });
    return {
      kpis: [
        { label: 'Buyurtmalar', value: '264', delta: '+12% kechadan', color: '#3fd69a', delay: '.1s' },
        { label: 'Yetkazildi', value: '81%', delta: '+3 f.p.', color: '#3fd69a', delay: '.15s' },
        { label: 'Kuryerlarda pul', value: '42 mln', delta: '18 mln — 3 kun', color: '#ff8a6a', delay: '.2s' },
        { label: 'Klinika', value: '37', delta: 'qabul bugun', color: '#9db3a7', delay: '.25s' }
      ],
      alerts: [
        { title: 'Kuryerda pul qolgan', sub: 'Jasur K. · Samarqand · 3 kun', amount: '18,4 mln', color: '#ff8a6a', bg: 'rgba(255,138,106,.08)', border: 'rgba(255,138,106,.25)', delay: '.3s' },
        { title: 'Balzam tugayapti', sub: 'Toshkent markaziy · 2,7 kun', amount: '−240', color: '#ff8a6a', bg: 'rgba(255,138,106,.05)', border: 'rgba(255,138,106,.18)', delay: '.38s' },
        { title: "Farg'onada kechikish", sub: "23 buyurtma 3+ kun yo'lda", amount: '23', color: '#e8c26a', bg: 'rgba(232,194,106,.05)', border: 'rgba(232,194,106,.18)', delay: '.46s' }
      ],
      filials: [
        { name: 'Toshkent', pct: 100, value: '148 mln', delay: '.5s' },
        { name: 'Samarqand', pct: 46, value: '68 mln', delay: '.55s' },
        { name: "Farg'ona", pct: 38, value: '56 mln', delay: '.6s' },
        { name: 'Buxoro', pct: 27, value: '40 mln', delay: '.65s' }
      ],
      tabs: [
        tab('Bosh', 'Main.dc.html', 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z', true),
        tab('Muammo', 'Issues.dc.html', 'M12 2.8 4.5 5.6v5.6c0 4.6 3.1 8.6 7.5 10 4.4-1.4 7.5-5.4 7.5-10V5.6Z', false),
        tab('AI', 'Ai.dc.html', 'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 1 0 0-13ZM15.5 15.5l5 5', false),
        tab('Xarita', 'Region.dc.html', 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2ZM9 4v14M15 6v14', false),
        tab('Ombor', 'Warehouse.dc.html', 'M3.5 9.5 12 4.5l8.5 5v10.5h-17ZM7.5 20v-6.5h9V20', false)
      ]
    };
  }
}
</script>
</body>
</html>
