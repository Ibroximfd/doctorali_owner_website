<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Yon panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap">
<style>
body{margin:0;background:#050d09}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
</style>
</helmet>
<aside aria-label="Bo'limlar" style="flex: 1 1 232px; max-width: 240px; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; font-family: Manrope, system-ui, sans-serif; color: #e8f1ec; background: linear-gradient(180deg, rgba(10,24,18,.92), rgba(5,13,9,.96)); border-right: 1px solid rgba(180,230,200,.08); position: relative; z-index: 1">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 20px; text-decoration: none; color: inherit">
    <span style="position: relative; width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(140deg, #1d6b4a, #0a2a1d); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px -8px rgba(63,214,154,.6)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8c26a" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      <span style="position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50% 0 50% 0; background: #3fd69a"></span>
    </span>
    <span style="line-height: 1.1"><span style="display: block; font-family: Fraunces, serif; font-size: 19px">Doctor Ali</span><span style="display: block; font-size: 11px; color: #6f877b; letter-spacing: .04em">Nazorat</span></span>
  </a>
  <nav aria-label="Bo'limlar" style="flex: 1; padding: 6px 12px 16px; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 2px; padding-top: {{g.pad}}">
        <sc-for list="{{g.items}}" as="item" hint-placeholder-count="5">
          <a href="{{item.href}}" aria-current="{{item.current}}" style="position: relative; display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 11px; text-decoration: none; font-size: 13.5px; font-weight: {{item.weight}}; color: {{item.color}}; background: {{item.bg}}; box-shadow: {{item.shadow}}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
            <span style="flex: 1">{{item.label}}</span>
            <sc-if value="{{item.badge}}" hint-placeholder-val="{{ false }}">
              <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{item.badgeBg}}; color: #04110b; font: 600 10px 'JetBrains Mono', monospace; display: grid; place-items: center">{{item.badge}}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
  <div style="margin: 0 12px 14px; padding: 14px; border-radius: 16px; background: radial-gradient(120% 120% at 0% 0%, rgba(63,214,154,.18), transparent 60%), rgba(255,255,255,.03); border: 1px solid rgba(180,230,200,.1)">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #8af0c2"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3fd69a; animation: glow 2s infinite"></span>Tizim joyida</div>
    <div style="margin-top: 4px; font-size: 11px; color: #6f877b">12 tekshiruvdan 9 tasi o'tdi · ERP sinxron 3 daq oldin</div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid rgba(180,230,200,.08)">
    <span style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(140deg, #e8c26a, #9b7424); color: #04110b; display: grid; place-items: center; font-size: 12px; font-weight: 700">AA</span>
    <span style="line-height: 1.25"><span style="display: block; font-size: 13px; font-weight: 600">Ali Azizov</span><span style="display: block; font-size: 11px; color: #6f877b">Bosh admin</span></span>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","issues","ai","forecast","warehouse","staff","access","logistics"],"default":"overview"},"$preview":{"width":240,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const I = {
      overview: 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z',
      issues: 'M12 2.8 4.5 5.6v5.6c0 4.6 3.1 8.6 7.5 10 4.4-1.4 7.5-5.4 7.5-10V5.6ZM7.5 12.4h2.3l1.4-3 2 5.6 1.4-2.6h1.9',
      ai: 'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 1 0 0-13ZM15.5 15.5l5 5M10.5 6.8c.4 2 1.3 2.9 3.3 3.3-2 .4-2.9 1.3-3.3 3.3-.4-2-1.3-2.9-3.3-3.3 2-.4 2.9-1.3 3.3-3.3Z',
      forecast: 'M3 20.5h18M3.5 16.5 7.5 12l3 2.5 3-3.5M13.5 11l2.2-2.4 2-1.6M19.5 2.8v3.4M17.8 4.5h3.4',
      orders: 'M16.5 9.4 7.5 4.2M21 16V8l-9-5-9 5v8l9 5zM3.3 7 12 12l8.7-5M12 22V12',
      finance: 'M19 7V4H5a2 2 0 0 0 0 4h15v4M3 6v12a2 2 0 0 0 2 2h15v-4M18 12a2 2 0 0 0 0 4h4v-4z',
      clinic: 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18zM10 6h4M10 10h4M10 14h4M10 18h4',
      logistics: 'M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2M15 18H9M19 18h2a1 1 0 0 0 1-1v-3.6l-3.5-4.4H14M7 16a2 2 0 1 0 0 4 2 2 0 1 0 0-4ZM17 16a2 2 0 1 0 0 4 2 2 0 1 0 0-4Z',
      warehouse: 'M3.5 9.5 12 4.5l8.5 5v10.5h-17ZM7.5 20v-6.5h9V20M7.5 16.8h9M12 4.5c.6-1.5 2-2.2 3.6-2-.2 1.6-1.4 2.6-3.6 2Z',
      settlements: 'M9.5 6a6 6 0 1 0 0 12 6 6 0 1 0 0-12ZM9.5 9v6M16.5 6.5a7.2 7.2 0 0 1 0 11',
      staff: 'M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22M14 14.7V17c0 .6.5 1 1 1.2 1.1.5 2 2 2 3.8M18 2H6v7a6 6 0 0 0 12 0V2Z',
      system: 'M3.5 3.5h17v6h-17zM3.5 14.5h17v6h-17zM10.5 6.5h2l1-1.5 1.5 3 1-1.5h1.5M10.5 17.5h7',
      access: 'M8 4a4.5 4.5 0 1 0 0 9 4.5 4.5 0 1 0 0-9ZM11.3 11.6 20 20.3M16.5 16.8l2-2M18.5 18.8l1.6-1.6'
    };
    const item = (key, label, href, badge, badgeBg) => {
      const on = key === active;
      return {
        key, label, href, icon: I[key], badge: badge ?? '', badgeBg: badgeBg ?? '#ff8a6a',
        current: on ? 'page' : 'false',
        bg: on ? 'linear-gradient(90deg, rgba(63,214,154,.16), rgba(63,214,154,.03))' : 'transparent',
        shadow: on ? 'inset 0 0 0 1px rgba(63,214,154,.22)' : 'none',
        color: on ? '#e8f1ec' : '#9db3a7',
        weight: on ? 700 : 500
      };
    };
    return {
      groups: [
        { pad: '0', items: [item('overview', 'Bosh sahifa', 'Main.dc.html'), item('ai', 'AI tahlil', 'Ai.dc.html', '2', '#e8c26a'), item('issues', 'Muammolar', 'Issues.dc.html', '3'), item('forecast', 'Prognoz', 'Forecast.dc.html')] },
        { pad: '18px', items: [item('orders', 'Buyurtmalar', '#'), item('finance', 'Moliya', '#'), item('clinic', 'Klinika', '#'), item('logistics', 'Yetkazib berish', 'Region.dc.html'), item('warehouse', 'Ombor', 'Warehouse.dc.html'), item('settlements', 'Hisob-kitob', '#'), item('staff', 'Xodimlar', 'Staff.dc.html')] },
        { pad: '18px', items: [item('system', 'Tizim holati', '#'), item('access', 'Ruxsatlar', 'Access.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
